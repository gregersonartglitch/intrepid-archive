[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# index.html is the shell — no long-lived browser cache (build 125 header fix)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# Reader page art — long-lived immutable cache. Bust via ?v=PAGE_ASSET_VERSION
# (or content-hash). Do NOT apply this to spike.js / index.html / CSS.
[[headers]]
  for = "/reader/intrepid-dusk-volume-1/assets/pages/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/reader/*/assets/pages/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dossier WebP thumbs/portraits — long cache; bust via ?v=CACHE_V in dossier/index.html
[[headers]]
  for = "/dossier/thumbs/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/dossier/portraits/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Isolated Archive opt-in: 302 /backer/ to /?entrance=backer so relative scripts
# load from site root (build 249). Local static hosts still use backer/index.html.
# Isolated opt-in only: do not add later Wave-1 session or media-shell rewrites.
[[redirects]]
  from = "/backer"
  to = "/?entrance=backer"
  status = 302
  force = true

[[redirects]]
  from = "/backer/"
  to = "/?entrance=backer"
  status = 302
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
