[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "reader/intrepid-dusk-volume-1/index.html",
    "dossier/index.html",
    "netlify/lib/asset-allowlist.json"
  ]

[functions."protected-media"]
  included_files = ["netlify/lib/asset-allowlist.json", "protected-assets/**"]

[functions."reader-shell"]
  included_files = ["reader/intrepid-dusk-volume-1/index.html"]

[functions."dossier-shell"]
  included_files = ["dossier/index.html"]

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/reader/intrepid-dusk-volume-1/assets/pages/cover-hardcover.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/protected-media/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Vary = "Cookie"

[[redirects]]
  from = "/backer"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/backer/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/access/login"
  to = "/.netlify/functions/access-login"
  status = 200

[[redirects]]
  from = "/api/access/logout"
  to = "/.netlify/functions/access-logout"
  status = 200

[[redirects]]
  from = "/api/access/session"
  to = "/.netlify/functions/access-session"
  status = 200

[[redirects]]
  from = "/api/build-info"
  to = "/.netlify/functions/build-info"
  status = 200

# /api/protected-media/* served by netlify/edge-functions/protected-media.js (streams large PDFs)

[[redirects]]
  from = "/reader/intrepid-dusk-volume-1"
  to = "/.netlify/functions/reader-shell"
  status = 200
  force = true

[[redirects]]
  from = "/reader/intrepid-dusk-volume-1/"
  to = "/.netlify/functions/reader-shell"
  status = 200
  force = true

[[redirects]]
  from = "/reader/intrepid-dusk-volume-1/index.html"
  to = "/.netlify/functions/reader-shell"
  status = 200
  force = true

[[redirects]]
  from = "/dossier"
  to = "/.netlify/functions/dossier-shell"
  status = 200
  force = true

[[redirects]]
  from = "/dossier/"
  to = "/.netlify/functions/dossier-shell"
  status = 200
  force = true

[[redirects]]
  from = "/dossier/index.html"
  to = "/.netlify/functions/dossier-shell"
  status = 200
  force = true
