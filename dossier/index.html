<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
   ═══════════════════════════════════════════ */
:root {
  --gold: #d4a843;
  --gold-dim: rgba(198,141,85,0.6);
  --bone: #bfb299;
  --bone-dim: rgba(191,178,153,0.55);
  --stone-dark: #0d0d12;
  --amber: #c68d55;
  --font-heading: 'Cinzel', serif;
  --font-display: 'Cinzel Decorative', 'Cinzel', serif;
  --font-body: 'EB Garamond', Georgia, serif;
  --ocean-deep: #080c14;
  --cyan-glow: rgba(120,190,210,0.15);
  --sidebar-w: 280px;
}

/* ═══════════════════════════════════════════
   RESET + BASE
   ═══════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-body);
  color: var(--bone);
  background: var(--ocean-deep);
}

/* ═══════════════════════════════════════════
   UNDERWATER BACKGROUND
   ═══════════════════════════════════════════ */
.ocean-bg {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 120% 80% at 50% 100%, rgba(10,22,40,0.8) 0%, transparent 70%),
    radial-gradient(ellipse 80% 60% at 30% 30%, rgba(15,35,60,0.4) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 70% 60%, var(--cyan-glow) 0%, transparent 50%),
    linear-gradient(180deg, #060a12 0%, #0a1628 30%, #0c1a30 60%, #080c14 100%);
}

/* ── Bubbles ── */
.bubbles { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.bubble {
  position: absolute; bottom: -20px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(180,220,240,0.12), rgba(120,190,210,0.04));
  border: 1px solid rgba(180,220,240,0.06);
  animation: rise linear infinite;
}
@keyframes rise {
  0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateY(-110vh) translateX(var(--drift)) scale(0.6); opacity: 0; }
}

/* ═══════════════════════════════════════════
   MASTER-DETAIL SHELL
   ═══════════════════════════════════════════ */
.dossier-shell {
  position: relative; z-index: 10;
  display: flex;
  height: 100vh;
}

/* ── LEFT: Sidebar / Roster ── */
.roster {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  border-right: 1px solid rgba(198,141,85,0.12);
  display: flex;
  flex-direction: column;
  background: rgba(6,8,14,0.6);
  backdrop-filter: blur(12px);
}
.roster-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid rgba(198,141,85,0.1);
  flex-shrink: 0;
}
.roster-back {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 8px 12px;
  margin: 0 0 8px -12px;
  border-radius: 4px;
  border: 1px solid rgba(198,141,85,0.4);
  background: transparent;
  font-family: var(--font-heading);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #d4a843;
  text-decoration: none;
  white-space: nowrap;
  transition: all 0.2s ease;
}
.roster-back::before { content: '← '; }
.roster-back:hover {
  background: rgba(198,141,85,0.15);
  border-color: var(--amber);
  color: #fff;
}
.roster-title {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 400;
  color: var(--gold);
  letter-spacing: 2px;
}
.roster-subtitle {
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--bone-dim);
  margin-top: 4px;
  font-style: italic;
}

/* ── Character List ── */
.roster-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  scrollbar-width: thin;
  scrollbar-color: rgba(198,141,85,0.2) transparent;
}
.roster-list::-webkit-scrollbar { width: 4px; }
.roster-list::-webkit-scrollbar-track { background: transparent; }
.roster-list::-webkit-scrollbar-thumb { background: rgba(198,141,85,0.2); border-radius: 2px; }

.roster-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 20px;
  cursor: pointer;
  transition: background 0.25s, border-color 0.25s;
  border-left: 3px solid transparent;
}
.roster-item:hover {
  background: rgba(198,141,85,0.05);
}
.roster-item.active {
  background: rgba(198,141,85,0.08);
  border-left-color: var(--gold);
}
.roster-item.active .ri-name { color: var(--gold); }

.ri-avatar {
  width: 48px; height: 48px;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  overflow: hidden;
  border: 1.5px solid rgba(198,141,85,0.25);
  flex-shrink: 0;
  transition: border-color 0.3s;
  position: relative;
  background: var(--stone-dark);
}
.roster-item.active .ri-avatar,
.roster-item:hover .ri-avatar { border-color: var(--gold); }
.ri-avatar img {
  width: 100%; height: 100%; object-fit: cover;
  object-position: center;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.ri-avatar img.is-loaded { opacity: 1; }
.ri-avatar.is-loading::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(198,141,85,0.14), transparent);
  animation: avatarShimmer 1.1s ease-in-out infinite;
}
@keyframes avatarShimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.ri-info { min-width: 0; }
.ri-name {
  font-family: var(--font-heading);
  font-size: 12px; font-weight: 700;
  color: var(--bone);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  transition: color 0.25s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ri-role {
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--bone-dim);
  font-style: italic;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── RIGHT: Detail Panel ── */
.detail {
  flex: 1;
  overflow-y: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 60px 40px;

  scrollbar-color: rgba(198,141,85,0.2) transparent;
}
.detail::-webkit-scrollbar { width: 6px; }
.detail::-webkit-scrollbar-track { background: transparent; }
.detail::-webkit-scrollbar-thumb { background: rgba(198,141,85,0.2); border-radius: 3px; }

.detail-inner {
  max-width: 560px;
  width: 100%;
  animation: fadeUp 0.4s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.detail-portrait {
  width: 220px; height: 220px;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  overflow: hidden;
  margin: 0 auto 28px;
  border: 2px solid rgba(198,141,85,0.35);
  box-shadow: 0 0 50px rgba(120,190,210,0.08), 0 8px 40px rgba(0,0,0,0.5);
  background: var(--stone-dark);
}
.detail-portrait img {
  width: 100%; height: 100%; object-fit: cover;
  object-position: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.detail-portrait img.is-loaded { opacity: 1; }
.detail-portrait.is-loading {
  background: rgba(198,141,85,0.06);
}

.detail-name {
  font-family: var(--font-display);
  font-size: 32px; font-weight: 400;
  color: var(--gold);
  letter-spacing: 3px;
  text-align: center;
  margin-bottom: 6px;
}
.detail-role {
  font-family: var(--font-heading);
  font-size: 11px;
  color: var(--amber);
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 28px;
}
.detail-divider {
  width: 80px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  margin: 0 auto 28px;
}
.detail-desc {
  font-family: var(--font-body);
  font-size: 18px;
  color: var(--bone);
  line-height: 1.75;

.detail-lore {
  font-family: var(--font-body);
  font-size: 16px;

  border-top: 1px solid rgba(198,141,85,0.1);
  text-align: left;
  opacity: 0.75;
}

/* ═══════════════════════════════════════════
   MOBILE: stack layout
   ═══════════════════════════════════════════ */
@media (max-width: 700px) {
  .dossier-shell { flex-direction: column; }

/* Bump when thumbs/portraits change. Source PNGs are not served (see .netlifyignore). */
var CACHE_V = '5';
var DOSSIER_BASE = '/dossier/';

function assetBaseName(imgPath) {
  return decodeURIComponent(imgPath).replace(/\.png$/i, '').replace(/ /g, '_');
}

function thumbSrc(imgPath) {
  return DOSSIER_BASE + 'thumbs/' + assetBaseName(imgPath) + '.webp?v=' + CACHE_V;
}

/* Medium WebP for detail (~640px). Absolute path avoids /dossier vs /dossier/ breakage. */
function portraitSrc(imgPath) {
  return DOSSIER_BASE + 'portraits/' + assetBaseName(imgPath) + '.webp?v=' + CACHE_V;
}

function bindPortraitLoad(img, container) {
  if (container) container.classList.add('is-loading');
  function done() {
    img.classList.add('is-loaded');
    if (container) container.classList.remove('is-loading');
  }
  if (img.complete && img.naturalWidth) {
    done();
  } else {
    img.addEventListener('load', done, { once: true });
    img.addEventListener('error', function() {
      /* Never leave the gold circle empty — keep shimmer off and show whatever we can. */
      if (container) container.classList.remove('is-loading');
      if (!img.classList.contains('is-loaded')) {
        img.classList.add('is-loaded');
      }
    }, { once: true });
  }
}

/* Detail: paint thumb immediately, then upgrade to medium WebP only (never full PNG). */
function bindDetailPortrait(img, container, imgPath) {
  bindPortraitLoad(img, container);
  var hi = new Image();
  hi.decoding = 'async';
  hi.onload = function() {
    if (!img.isConnected) return;
    img.src = hi.src;
  };
  hi.src = portraitSrc(imgPath);
}

// ═══════════════════════════════════════════
// BUILD ROSTER
// ═══════════════════════════════════════════
var rosterList = document.getElementById('roster-list');
var detailInner = document.getElementById('detail-inner');
var activeIndex = 0;

function buildRoster() {
  CHARACTERS.forEach(function(c, i) {
    var item = document.createElement('div');
    item.className = 'roster-item' + (i === 0 ? ' active' : '');
    item.setAttribute('data-index', i);

    var avatar = document.createElement('div');
    avatar.className = 'ri-avatar';

    var img = document.createElement('img');
    img.src = thumbSrc(c.img);
    img.alt = c.name;
    img.width = 96;
    img.height = 96;
    img.loading = i < 4 ? 'eager' : 'lazy';
    img.decoding = 'async';
    bindPortraitLoad(img, avatar);
    avatar.appendChild(img);

    var info = document.createElement('div');
    info.className = 'ri-info';
    info.innerHTML =
      '<div class="ri-name">' + c.name + '</div>' +
      '<div class="ri-role">' + c.role + '</div>';

    item.appendChild(avatar);
    item.appendChild(info);
    item.addEventListener('click', function() { selectCharacter(i); });
    rosterList.appendChild(item);
  });
}

function selectCharacter(index) {
  activeIndex = index;
  var c = CHARACTERS[index];

  // Update active state in roster
  var items = rosterList.querySelectorAll('.roster-item');
  items.forEach(function(el) { el.classList.remove('active'); });
  items[index].classList.add('active');

  // Re-render detail with animation
  detailInner.style.animation = 'none';
  detailInner.offsetHeight; // reflow
  detailInner.style.animation = '';

  var html =
    '<div class="detail-portrait is-loading"><img src="' + thumbSrc(c.img) + '" alt="' + c.name + '" width="220" height="220" loading="eager" decoding="async" fetchpriority="high"></div>' +
    '<div class="detail-name">' + c.name + '</div>' +
    '<div class="detail-role">' + c.role + '</div>' +
    '<div class="detail-divider"></div>' +
    '<div class="detail-desc">' + c.desc + '</div>';
  if (c.lore) {
    html += '<div class="detail-lore">' + c.lore + '</div>';
  }
  detailInner.innerHTML = html;

  var portraitWrap = detailInner.querySelector('.detail-portrait');
  var portraitImg = portraitWrap && portraitWrap.querySelector('img');
  if (portraitImg) bindDetailPortrait(portraitImg, portraitWrap, c.img);

  // Scroll detail to top
  document.getElementById('detail').scrollTop = 0;
  preloadNearbyPortraits(index);
}

function preloadNearbyPortraits(index) {
  [index + 1, index - 1].forEach(function(i) {
    if (!CHARACTERS[i] || CHARACTERS[i]._preloaded) return;
    var thumb = new Image();
    thumb.decoding = 'async';
    thumb.src = thumbSrc(CHARACTERS[i].img);
    var port = new Image();
    port.decoding = 'async';
    port.src = portraitSrc(CHARACTERS[i].img);
    CHARACTERS[i]._preloaded = true;
  });
}

// ═══════════════════════════════════════════

// ═══════════════════════════════════════════
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown' || e.key === 'j') {
    e.preventDefault();
    selectCharacter(Math.min(activeIndex + 1, CHARACTERS.length - 1));
    scrollRosterIntoView();
  } else if (e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault();
    selectCharacter(Math.max(activeIndex - 1, 0));
    scrollRosterIntoView();
  }
});

function scrollRosterIntoView() {
  var items = rosterList.querySelectorAll('.roster-item');
  if (items[activeIndex]) {
    items[activeIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// ═══════════════════════════════════════════
// BUBBLE PARTICLES
// ═══════════════════════════════════════════
(function() {
  var container = document.getElementById('bubbles');
  for (var i = 0; i < 20; i++) {
    var b = document.createElement('div');
    b.className = 'bubble';
    var size = 3 + Math.random() * 8;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + '%';
    var dur = 12 + Math.random() * 18;
    b.style.animationDuration = dur + 's';
    b.style.animationDelay = '-' + (Math.random() * dur) + 's';
    b.style.setProperty('--drift', (Math.random() - 0.5) * 60 + 'px');
    container.appendChild(b);
  }
})();

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
buildRoster();
selectCharacter(0);
</script>
</body>
