<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070706" />
    <title>Intrepid Dusk Volume 1 Reader</title>
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <main class="reader" aria-label="Intrepid Dusk Volume 1 reader">
      <header class="reader-header" aria-label="Reader navigation">
        <div class="reader-header-start">
          <a class="home-link" href="/">← Archive</a>
          <button
            type="button"
            class="ambient-toggle"
            data-action="ambient"
            aria-pressed="false"
            title="Toggle ambient music"
          >🔊</button>
        </div>
        <div class="reader-title">
          <p class="eyebrow">Intrepid Dusk</p>
          <h1>Volume 1 Reader</h1>
          <p class="build-label">Issues 1–3</p>
        </div>
        <div class="reader-meta">
          <p class="page-counter" aria-live="polite">
            <span class="page-counter-label">Page</span>
            <strong data-page>1 / 68</strong>
          </p>
          <div class="controls" aria-label="Page controls">
            <button type="button" data-action="prev">Previous</button>
            <button type="button" data-action="next">Next</button>
            <button type="button" data-action="reset">Reset</button>
          </div>
        </div>
      </header>

      <section class="reader-stage" aria-label="Comic pages">
        <div id="book" class="book" aria-label="Interactive comic page curl"></div>
      </section>
    </main>

    <script src="./vendor/page-flip.browser.js"></script>
    <script src="./audio.js?v=2"></script>
    <script src="./spike.js?v=5"></script>
  </body>
</html>
