<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070706" />
    <title>Intrepid Dusk Volume 1 Reader</title>
    <link rel="stylesheet" href="./styles.css?v=177" />
  </head>
  <body>
    <main class="reader is-preparing" aria-label="Intrepid Dusk Volume 1 reader">
      <header class="reader-header" aria-label="Reader navigation">
        <div class="reader-header-start">
          <a class="home-link" href="/">&larr; Archive</a>
          <button type="button" id="reader-reset-access" class="home-link reader-reset-access">Reset access</button>
          <div class="audio-toggles" aria-label="Audio controls">
            <button
              type="button"
              class="audio-toggle"
              data-action="ambient"
              aria-pressed="true"
              title="Toggle ambient music"
            >Ambient</button>
            <button
              type="button"
              class="audio-toggle"
              data-action="sfx"
              aria-pressed="true"
              title="Toggle sound effects"
            >Effects</button>
          </div>
        </div>
        <div class="reader-title">
          <p class="eyebrow">Intrepid Dusk</p>
          <h1>Volume 1 Reader</h1>
          <p class="build-label">Issues 1&ndash;3</p>
        </div>
        <div class="reader-meta">
          <p class="page-counter" aria-live="polite">
            <span class="page-counter-label">Page</span>
            <strong data-page>1 / 68</strong>
          </p>
          <div class="controls" aria-label="Page controls">
            <button type="button" data-action="prev">Previous</button>
            <button type="button" data-action="next">Next</button>
            <button type="button" data-action="reset">Reset</button>
          </div>
          <button
            type="button"
            class="reader-help-launch"
            data-action="help-open"
            aria-label="Show reader help tip"
            title="Reader help"
          >?</button>
        </div>
      </header>

      <section class="reader-stage" aria-label="Comic pages">
        <div
          class="reader-load-veil"
          data-reader-load-veil
          aria-live="polite"
          aria-busy="true"
        >
          <div class="reader-load-veil__inner">
            <p class="reader-load-veil__eyebrow">Intrepid Dusk</p>
            <p class="reader-load-veil__title">Preparing the volume&hellip;</p>
            <p class="reader-load-veil__progress" data-reader-load-progress>0%</p>
          </div>
        </div>
        <div id="book" class="book" aria-hidden="true" aria-label="Interactive comic page curl"></div>
      </section>
      <aside class="reader-help-tip" data-reader-help-tip hidden aria-live="polite">
        <button
          type="button"
          class="reader-help-tip-close"
          data-action="help-dismiss"
          aria-label="Dismiss reader help tip"
          title="Dismiss"
        >&times;</button>
        <p class="reader-help-tip-title">Reader tips</p>
        <p class="reader-help-tip-body">
          Keyboard: <kbd>ArrowLeft</kbd>/<kbd>ArrowRight</kbd> for prev/next,
          <kbd>Home</kbd>/<kbd>End</kbd> for first/last.
          <span data-reader-help-magnify></span>
        </p>
      </aside>
    </main>

    <script src="/archive-access.js?v=165"></script>
    <script>
      window.ENABLE_STRIPE_CHECKOUT = true;
      window.INTREPID_GUEST_PRICE = 15;
    </script>
    <script>
    (function () {
      if (!window.IntrepidArchiveAccess || !window.IntrepidArchiveAccess.guardPublicContentRoute) return;
      window.IntrepidArchiveAccess.guardPublicContentRoute("/");
    })();
    </script>
    <script src="../backer-gate.js?v=111"></script>
    <script src="./vendor/page-flip.browser.js"></script>
    <script src="./audio.js?v=4"></script>
    <script src="./spike.js?v=177"></script>
    <script>
    (function () {
      var btn = document.getElementById("reader-reset-access");
      if (!btn || !window.IntrepidArchiveAccess) return;
      btn.addEventListener("click", function () {
        if (!window.confirm("Clear reader and cartographer access on this device?")) return;
        window.IntrepidArchiveAccess.resetArchiveAccess();
        window.location.reload();
      });
    })();
    </script>
  </body>
</html>
